<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KKSK Group</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#10281F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="supabase-runtime.js"></script>
<link rel="stylesheet" href="auth.css">
<style>
:root{--forest:#10281F;--kk:#009256;--brand:#007A4D;--brand-text:#00704A;--brand-soft:#E3F2EA;--bg:#F4F7F5;--surface:#FFFFFF;--ink:#14231C;--muted:#5E6E66;--line:#DCE5E0;--soft:#F1F6F3;
  --shadow:0 1px 2px rgba(16,40,31,.05),0 14px 34px -20px rgba(16,40,31,.30);--font:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:"Marcellus",Georgia,serif;color-scheme:light}
html[data-accent="ocean"]{--forest:#0F2A3D;--kk:#0A84C1;--brand:#0B6FA4;--brand-text:#0B6395;--brand-soft:#E2F0F8}
html[data-accent="indigo"]{--forest:#1E1B4B;--kk:#4F46E5;--brand:#4338CA;--brand-text:#4338CA;--brand-soft:#EEF2FF}
html[data-accent="plum"]{--forest:#3B0A2E;--kk:#A21CAF;--brand:#86198F;--brand-text:#86198F;--brand-soft:#FAE8FF}
html[data-accent="terracotta"]{--forest:#3A1A0E;--kk:#C2410C;--brand:#B4410F;--brand-text:#9A3412;--brand-soft:#FFEDD5}
html[data-accent="charcoal"]{--forest:#1F2328;--kk:#4B5563;--brand:#374151;--brand-text:#374151;--brand-soft:#EEF0F2}
html[data-theme="dark"]{color-scheme:dark;--bg:#0E1513;--surface:#16201C;--ink:#E4ECE7;--muted:#9DB0A6;--line:#2B3B34;--soft:#1C2924;
  --brand-soft:color-mix(in srgb,var(--kk) 22%,#16201C);--brand-text:color-mix(in srgb,var(--kk) 55%,#ffffff)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px}
.mark{width:50px;height:50px;border-radius:10px;background:#fff;padding:3px;flex:none;border:1px solid var(--line)}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
.titles{flex:1;min-width:0}
.t1{font-family:var(--serif);font-size:22px;color:var(--forest);line-height:1.2}
html[data-theme="dark"] .t1{color:var(--ink)}
.t2{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--kk);font-weight:600;margin-top:2px}
.me{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--line);background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-text);font-weight:700;font-size:14px}
.me .nm{font-weight:600;font-size:13.5px;line-height:1.2}.me .rl{font-size:12px;color:var(--muted)}
.lnk{border:0;background:none;color:var(--brand-text);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 0;text-decoration:underline}
.bar{background:var(--forest);height:8px}
main{padding:34px 0 60px}
h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0;color:var(--forest)}
html[data-theme="dark"] h2{color:var(--ink)}
.sub{color:var(--muted);margin:4px 0 22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 22px 20px;position:relative;overflow:hidden;transition:transform .12s ease,box-shadow .12s ease}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--kk)}
.tile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,40,31,.06),0 22px 40px -22px rgba(16,40,31,.45)}
.tile:focus-visible{outline:3px solid var(--kk);outline-offset:3px}
.ic{width:46px;height:46px;border-radius:12px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center}
.tile b{font-size:18px;font-weight:600}
.tile p{margin:0;color:var(--muted);font-size:14px}
.tile .role{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text);background:var(--brand-soft);border-radius:999px;padding:3px 10px;align-self:flex-start}
.tile .go{margin-top:auto;font-weight:600;color:var(--brand-text);font-size:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);max-width:620px}
#bvSignOut{display:none}
.foot{color:var(--muted);font-size:12.5px;margin-top:28px}
@media (max-width:640px){.wrap{padding:0 16px}.t1{font-size:18px}.me .nm,.me .rl{display:none}h2{font-size:24px}}
</style>
</head>
<body>
<header class="top" id="top" hidden><div class="wrap">
  <div class="mark"><img src="favicon.png" alt="KKSK"></div>
  <div class="titles"><div class="t1">KKSK Group</div><div class="t2">Your apps</div></div>
  <div class="me" id="me"></div>
</div></header>
<div class="bar" id="bar" hidden></div>
<main class="wrap" id="main" hidden>
  <h2 id="hi"></h2>
  <p class="sub" id="hiSub">Choose the app to open.</p>
  <div class="tiles" id="tiles"></div>
  <p class="foot">Each app keeps its own data. Your sign-in, picture and look settings are shared across them.</p>
</main>
<script src="portal.js"></script>
</body>
</html>
