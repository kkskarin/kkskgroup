<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trial App</title>
<script src="../textsize.js"></script><link rel="icon" type="image/png" href="../favicon.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<!-- Public: anyone with the address can open it, no sign-in. Not on the All Apps page. Its data is in trial_docs (open to all). -->
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--bar:#10281F;--hl:#2DBE7E;--brand:#007A4D;--brand-soft:#E3F2EA;--bg:#F4F7F5;--surface:#FFFFFF;--ink:#14231C;--muted:#5E6E66;--line:#DCE5E0;--soft:#F1F6F3;--navtext:#B9CCC2;--bad:#B42318;--bad-bg:#FDECEA;
--ok-bg:#CDEEDB;--ok:#00704A;--part:#E08A00;--none-bg:#FBD5D2;--none:#B42318;
--font:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:"Marcellus",Georgia,"Times New Roman",serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(15px*var(--ts,1))/1.5 var(--font)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px}
header .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px}
header b{font:calc(22px*var(--ts,1)) var(--serif)}
nav{background:var(--bar)}
nav .in,.sub .in{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 8px}
nav button,.sub button{border:0;background:none;font:inherit;cursor:pointer;white-space:nowrap;padding:14px 14px 12px;border-bottom:3px solid transparent}
nav button{color:var(--navtext);font-weight:600}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--hl)}
.sub{background:var(--surface);border-bottom:1px solid var(--line)}
.sub button{color:var(--muted);font-weight:500}
.sub button[aria-selected="true"]{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
.sub button.sep{margin-left:auto}
main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
main h1{margin:0 0 4px;font:calc(28px*var(--ts,1)) var(--serif)}
.subt{margin:0 0 18px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:calc(13px*var(--ts,1));letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.card h4{margin:14px 0 6px;font-size:calc(15px*var(--ts,1))}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:calc(13px*var(--ts,1))}
.field{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit;min-width:0}
.field:focus{outline:2px solid var(--brand);outline-offset:1px}
textarea.field{min-height:110px;width:100%}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:5px 10px;font-size:calc(13px*var(--ts,1))}
.btn:disabled{opacity:.5;cursor:default}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:calc(12px*var(--ts,1));letter-spacing:.06em;text-transform:uppercase;color:var(--brand);background:var(--soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td,td.tot{font-weight:700;background:var(--soft)}
tr.sec td{font-weight:700;background:#F8FBF9;color:var(--brand)}
td input.field{width:120px;text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.hint{color:var(--muted);font-size:calc(13px*var(--ts,1))}
.msg{margin-top:10px;font-weight:600}
.msg.bad{color:var(--bad)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:500}
.mlist .mrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mlist .mrow .field.nm{flex:1 1 180px}
.empty{color:var(--muted);padding:6px 0}
/* the date calendar */
.cal{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;user-select:none}
.cal .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-weight:600}
.cal .hd button{border:0;background:none;font:inherit;font-size:calc(18px*var(--ts,1));cursor:pointer;padding:2px 10px;border-radius:8px}
.cal .hd button:disabled{opacity:.3;cursor:default}
.cal .g{display:grid;grid-template-columns:repeat(7,calc(40px*var(--ts,1)));gap:3px}
.cal .wd{text-align:center;font-size:calc(11px*var(--ts,1));color:var(--muted);font-weight:600}
.cal .d{position:relative;height:calc(36px*var(--ts,1));border:1px solid transparent;border-radius:8px;background:none;font:inherit;cursor:pointer;color:var(--ink)}
.cal .d:disabled{color:#A9B5AF;cursor:default}
.cal .d.full{background:var(--ok-bg);color:var(--ok);font-weight:700}
.cal .d.none{background:var(--none-bg);color:var(--none)}
.cal .d.part::after{content:"";position:absolute;left:50%;bottom:3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--part)}
.cal .d.today{border-color:var(--muted)}
.cal .d.on{outline:2px solid var(--brand);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:calc(12px*var(--ts,1));color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .lf::before{background:var(--ok-bg)}.legend .lp::before{background:var(--part);border-radius:50%}.legend .ln::before{background:var(--none-bg)}
@media print{html{--ts:1!important}}
</style>
</head>
<body>
<header><div class="in"><img src="../favicon.png" alt=""><b>Trial App</b></div></header>
<nav aria-label="Sections"><div class="in" id="tabs" role="tablist"></div></nav>
<div class="sub"><div class="in" id="subs" role="tablist"></div></div>
<main><h1 id="title"></h1><p class="subt" id="subtitle"></p><div id="body"></div></main>
<script>
(function () {
  "use strict";
  /* Tabs, each with its places (where pieces are counted), then Reports and Masters. A tab marked oneEntry has a single
     Entry sub-tab instead, with a card per place. The open one is kept in the address (#tab/sub).
     Data is in Supabase table trial_docs, open to anyone with the link. Two kinds of tab:
       stage tabs (Raw to Tanned, WB Split - Ambur): masters/<tab>/<place> { items: [{ id, name }] } are the stages;
         entry/<tab>/<place>/<date> { date, cells: { <stageId>: { dom, imp } } }: pieces at each stage that day.
       grade tabs (Tanned & Assorted): masters/<tab>/<place> { items: [{ id, name, origin: dom|imp|both, mat: wb|ww|both }] }
         are the grades; entry/<tab>/<place>/<date> { date, cells: { "<dom|imp>|<wb|ww>|<gradeId>": { p, a } } }:
         pieces and area of each grade that day, by Domestic / Import and Wet Blue / Wet White.
     An entry is the stock position on that day. */
  var TABS = [
    { key: "raw", name: "Raw to Tanned", kind: "stage", places: [["erode", "Erode"], ["ambur", "Ambur"], ["ranipet", "Ranipet"]], oneEntry: true },
    { key: "tanned", name: "Tanned & Assorted", kind: "grade", places: [["grain", "Grain"], ["split", "Split"]], oneEntry: true },
    { key: "wbsplit", name: "WB Split - Ambur", kind: "stage", places: [["input", "Input"], ["output", "Output"]] }
  ];
  var ORIGINS = [["dom", "Domestic"], ["imp", "Import"]], MATS = [["wb", "Wet Blue"], ["ww", "Wet White"]];
  var CFG = window.BV_CONFIG || {}, sb = window.supabase && CFG.supabaseUrl ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: false, autoRefreshToken: false } }) : null;
  var D = { docs: {}, loaded: false, err: "" }, cur = {}, ENT = {}, REP = {};

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, text) { var e = document.createElement(tag); Object.keys(attrs || {}).forEach(function (k) { if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }); if (text != null) e.textContent = text; return e; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function addDays(s, n) { var d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); }
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmtDate(s) { if (!s) return ""; var d = new Date(s + "T00:00:00"); return pad(d.getDate()) + "-" + MON[d.getMonth()] + "-" + String(d.getFullYear()).slice(2); }
  function pcs(n) { return (Number(n) || 0).toLocaleString("en-IN"); }
  function area(n) { return (Number(n) || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function int(v) { v = String(v == null ? "" : v).replace(/[,\s]/g, ""); if (v === "") return null; return /^\d+$/.test(v) ? Number(v) : NaN; }
  function dec(v) { v = String(v == null ? "" : v).replace(/[,\s]/g, ""); if (v === "") return null; return /^\d+(\.\d{1,2})?$/.test(v) ? Number(v) : NaN; }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function label(list, k) { var x = list.filter(function (o) { return o[0] === k; })[0]; return x ? x[1] : ""; }

  /* ---- data ---- */
  function loadAll() {
    if (!sb) { D.err = "The app couldn't connect. Reload the page."; render(); return Promise.resolve(); }
    var all = [], step = 1000;
    function page(from) { return sb.from("trial_docs").select("path,data").order("path").range(from, from + step - 1).then(function (r) { if (r.error) throw r.error; all = all.concat(r.data || []); if ((r.data || []).length === step) return page(from + step); }); }
    return page(0).then(function () { D.docs = {}; all.forEach(function (x) { D.docs[x.path] = x.data; }); D.loaded = true; D.err = ""; render(); },
      function (e) { D.err = "The data couldn't be loaded (" + ((e && e.message) || "error") + "). Reload the page."; render(); });
  }
  function put(path, data) {
    return sb.from("trial_docs").upsert({ path: path, data: data, updated_at: new Date().toISOString() }, { onConflict: "path" }).then(function (r) { if (r.error) throw r.error; D.docs[path] = data; });
  }
  function masters(tab, place) { var m = D.docs["masters/" + tab + "/" + place]; return (m && m.items) || []; }
  function entry(tab, place, date) { return D.docs["entry/" + tab + "/" + place + "/" + date] || null; }
  function entryDates(tab, place) { var p = "entry/" + tab + "/" + place + "/"; return Object.keys(D.docs).filter(function (k) { return k.indexOf(p) === 0; }).map(function (k) { return k.slice(p.length); }).sort(); }
  /* a grade counts in a Domestic / Import and Wet Blue / Wet White section when it is set for it (or for both) */
  function gradeIn(g, o, m) { return (g.origin === "both" || g.origin === o) && (g.mat === "both" || g.mat === m); }

  /* ---- navigation ---- */
  function subsOf(t) { return (t.oneEntry ? [["entry", "Entry"]] : t.places).concat([["reports", "Reports"], ["masters", "Masters"]]); }
  function fromHash() {
    var p = location.hash.replace(/^#/, "").split("/"), t = TABS.filter(function (x) { return x.key === p[0]; })[0] || TABS[0], subs = subsOf(t);
    cur = { tab: t, sub: subs.filter(function (s) { return s[0] === p[1]; })[0] || subs[0] };
  }
  function go(t, s) { location.hash = t.key + "/" + s[0]; }
  function tabBtn(lbl, on, fn, cls) { var b = el("button", { type: "button", role: "tab", "aria-selected": on ? "true" : "false" }, lbl); if (cls) b.className = cls; b.addEventListener("click", fn); return b; }
  function render() {
    var tb = $("tabs"), sbx = $("subs"); tb.textContent = ""; sbx.textContent = "";
    TABS.forEach(function (t) { tb.appendChild(tabBtn(t.name, t === cur.tab, function () { go(t, subsOf(t)[0]); })); });
    subsOf(cur.tab).forEach(function (s) { sbx.appendChild(tabBtn(s[1], s[0] === cur.sub[0], function () { go(cur.tab, s); }, s[0] === "reports" ? "sep" : "")); });
    $("title").textContent = cur.tab.name + " · " + cur.sub[1]; document.title = cur.sub[1] + " · " + cur.tab.name + " · Trial App";
    var body = $("body"); body.textContent = ""; $("subtitle").textContent = "";
    if (D.err) { body.appendChild(el("div", { class: "card msg bad" }, D.err)); return; }
    if (!D.loaded) { body.appendChild(el("div", { class: "card hint" }, "Loading…")); return; }
    if (cur.sub[0] === "masters") return renderMasters(body);
    if (cur.sub[0] === "reports") return renderReports(body);
    renderEntry(body);
  }

  /* ---- the date calendar: a month at a time; only lo..hi can be picked. Each day shows how complete it is:
     green all saved, orange dot some saved, red none saved (past days only, from the first entry); Sundays are left plain. ---- */
  function calendar(box, o) {
    var view = o.value.slice(0, 7);
    function draw() {
      box.textContent = ""; var c = el("div", { class: "cal" }), hd = el("div", { class: "hd" });
      var y = Number(view.slice(0, 4)), mo = Number(view.slice(5, 7)) - 1, first = new Date(y, mo, 1), prev = ymd(new Date(y, mo - 1, 1)).slice(0, 7), next = ymd(new Date(y, mo + 1, 1)).slice(0, 7);
      var pb = el("button", { type: "button", "aria-label": "Previous month" }, "‹"), nb = el("button", { type: "button", "aria-label": "Next month" }, "›");
      pb.disabled = prev < o.lo.slice(0, 7) && prev < (o.from || o.lo).slice(0, 7); nb.disabled = next > o.hi.slice(0, 7);
      pb.addEventListener("click", function () { view = prev; draw(); }); nb.addEventListener("click", function () { view = next; draw(); });
      hd.appendChild(pb); hd.appendChild(el("span", null, MON[mo] + " " + y)); hd.appendChild(nb); c.appendChild(hd);
      var g = el("div", { class: "g" }); ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].forEach(function (w) { g.appendChild(el("div", { class: "wd" }, w)); });
      for (var i = 0; i < (first.getDay() + 6) % 7; i++) g.appendChild(el("div"));
      for (var d = 1; d <= new Date(y, mo + 1, 0).getDate(); d++) (function (ds, sun) {
        var s = sun ? "" : o.status(ds), b = el("button", { type: "button", class: "d" + (s ? " " + s : "") + (ds === o.value ? " on" : "") + (ds === o.hi ? " today" : ""), "aria-label": fmtDate(ds) + (s === "full" ? ", all saved" : s === "part" ? ", partly saved" : s === "none" ? ", nothing saved" : "") }, String(d));
        b.disabled = ds < o.lo || ds > o.hi; b.addEventListener("click", function () { o.pick(ds); }); g.appendChild(b);
      })(ymd(new Date(y, mo, d)), new Date(y, mo, d).getDay() === 0);
      c.appendChild(g); box.appendChild(c);
      var lg = el("div", { class: "legend" }); [["lf", "All saved"], ["lp", "Partly saved"], ["ln", "Nothing saved"]].forEach(function (x) { lg.appendChild(el("span", { class: x[0] }, x[1])); }); box.appendChild(lg);
    }
    draw();
  }
  /* how complete a day is for the places shown: full, part, none (past days from the first entry on), or "" */
  function dayStatus(t, places, d) {
    var n = places.filter(function (pl) { return !!entry(t.key, pl[0], d); }).length;
    if (n && n === places.length) return "full"; if (n) return "part";
    var first = places.reduce(function (m, pl) { var ds = entryDates(t.key, pl[0]); return ds.length && (!m || ds[0] < m) ? ds[0] : m; }, "");
    return first && d >= first && d < today() ? "none" : "";
  }

  /* ---- Entry: the day's figures, a card per place ---- */
  function renderEntry(body) {
    var t = cur.tab, places = t.oneEntry ? t.places : [cur.sub], key = t.key + "/" + cur.sub[0], lo = addDays(today(), -6), hi = today();
    $("subtitle").textContent = (t.kind === "grade" ? "Pieces and area of each grade" : "Pieces at each stage") + " on the chosen day. Pick the day on the calendar: today or the 6 days before can be entered or corrected.";
    var st = ENT[key] = ENT[key] || { date: hi };
    if (st.date < lo || st.date > hi) st.date = hi;
    var c1 = el("div", { class: "card" }); c1.appendChild(el("h3", null, "Date · " + fmtDate(st.date))); var cb = el("div"); c1.appendChild(cb); body.appendChild(c1);
    var first = places.reduce(function (m, pl) { var ds = entryDates(t.key, pl[0]); return ds.length && (!m || ds[0] < m) ? ds[0] : m; }, "");
    calendar(cb, { value: st.date, lo: lo, hi: hi, from: first, status: function (d) { return dayStatus(t, places, d); }, pick: function (d) { st.date = d; render(); } });
    var get = t.kind === "grade" ? gradeCards(body, t, places, st.date) : stageCards(body, t, places, st.date);
    if (!get) return;
    var c3 = el("div", { class: "card" }), acts = el("div", { class: "row" }), saved = places.some(function (pl) { return !!entry(t.key, pl[0], st.date); });
    var save = el("button", { type: "button", class: "btn primary" }, saved ? "Save Changes" : "Save"), msg = el("div", { class: "msg" });
    acts.appendChild(save); c3.appendChild(acts); c3.appendChild(msg); body.appendChild(c3);
    save.addEventListener("click", function () {
      msg.textContent = ""; msg.className = "msg";
      if (st.date < addDays(today(), -6) || st.date > today()) { msg.textContent = "Only today and the 6 days before can be entered."; msg.className = "msg bad"; return; }
      var r = get(); if (r.bad) { msg.textContent = r.bad; msg.className = "msg bad"; return; }
      save.disabled = true;
      Promise.all(r.docs.map(function (d) { return put("entry/" + t.key + "/" + d[0] + "/" + st.date, { date: st.date, cells: d[1], updatedAt: Date.now() }); })).then(function () { render(); var ms2 = document.querySelectorAll("#body .msg"), m2 = ms2[ms2.length - 1]; if (m2) m2.textContent = "Saved for " + fmtDate(st.date) + "."; },
        function (er) { save.disabled = false; msg.textContent = "Not saved: " + ((er && er.message) || "error") + ". Try again."; msg.className = "msg bad"; });
    });
  }
  function inp(lbl, val) { var ip = el("input", { class: "field", inputmode: "decimal", "aria-label": lbl, placeholder: "0" }); ip.value = val == null ? "" : String(val); return ip; }
  /* stage tabs: a table per place, a row per stage, Domestic and Import across */
  function stageCards(body, t, places, date) {
    var inputs = {}, any = false;
    places.forEach(function (pl) {
      var ms = masters(t.key, pl[0]), e = entry(t.key, pl[0], date), cells = (e && e.cells) || {}, c2 = el("div", { class: "card" });
      c2.appendChild(el("h3", null, pl[1] + (e ? " · saved" : " · not entered yet")));
      if (!ms.length) { c2.appendChild(el("div", { class: "empty" }, "No stages for " + pl[1] + " yet. Add them under Masters.")); body.appendChild(c2); return; }
      any = true;
      var sc = el("div", { class: "scroll" }), tbl = el("table"), thead = el("thead"), hr = el("tr"); hr.appendChild(el("th", null, "Particulars"));
      ORIGINS.forEach(function (o) { hr.appendChild(el("th", { class: "n" }, o[1])); }); thead.appendChild(hr); tbl.appendChild(thead);
      var tbody = el("tbody");
      ms.forEach(function (m) {
        var tr = el("tr"); tr.appendChild(el("td", null, m.name));
        ORIGINS.forEach(function (o) { var td = el("td", { class: "n" }), ip = inp(pl[1] + " " + o[1] + " " + m.name, cells[m.id] && cells[m.id][o[0]]); ip.setAttribute("inputmode", "numeric"); inputs[pl[0] + "|" + o[0] + "|" + m.id] = ip; td.appendChild(ip); tr.appendChild(td); });
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody); sc.appendChild(tbl); c2.appendChild(sc); body.appendChild(c2);
    });
    if (!any) return null;
    return function () {
      var docs = [], bad = "";
      places.forEach(function (pl) {
        var ms = masters(t.key, pl[0]); if (!ms.length) return; var out = {};
        ms.forEach(function (m) { var c = {}; ORIGINS.forEach(function (o) { var n = int(inputs[pl[0] + "|" + o[0] + "|" + m.id].value); if (isNaN(n)) bad = bad || pl[1] + " · " + m.name + " · " + o[1]; else c[o[0]] = n || 0; }); out[m.id] = c; });
        docs.push([pl[0], out]);
      });
      return bad ? { bad: "Pieces are whole numbers. Check " + bad + "." } : { docs: docs };
    };
  }
  /* grade tabs: a card per place with a Domestic and an Import table; each has Wet Blue, then Wet White, a row per grade */
  function gradeCards(body, t, places, date) {
    var inputs = {}, any = false;
    places.forEach(function (pl) {
      var gs = masters(t.key, pl[0]), e = entry(t.key, pl[0], date), cells = (e && e.cells) || {}, c2 = el("div", { class: "card" });
      c2.appendChild(el("h3", null, pl[1] + (e ? " · saved" : " · not entered yet")));
      if (!gs.length) { c2.appendChild(el("div", { class: "empty" }, "No grades for " + pl[1] + " yet. Add them under Masters.")); body.appendChild(c2); return; }
      any = true; var two = el("div", { class: "two" });
      ORIGINS.forEach(function (o) {
        var w = el("div"); w.appendChild(el("h4", null, o[1])); var sc = el("div", { class: "scroll" }), tbl = el("table"), thead = el("thead"), hr = el("tr");
