<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KKSK Group</title>
<script src="../textsize.js"></script><link rel="icon" type="image/png" href="../favicon.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../config.js"></script>
<!-- Not on the All Apps page: reached only by its address. The group sign-in comes first (the runtime sends people there and back). -->
<script>window.BV_APP = "inv"; window.BV_HOME = "../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../supabase-runtime.js"></script>
<link rel="stylesheet" href="../auth.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--bar:#10281F;--brand:#007A4D;--bg:#F4F7F5;--surface:#FFFFFF;--ink:#14231C;--muted:#5E6E66;--line:#DCE5E0;
--font:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:"Marcellus",Georgia,"Times New Roman",serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(15px*var(--ts,1))/1.5 var(--font)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px}
header .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px}
header b{font:calc(22px*var(--ts,1)) var(--serif)}
header a{margin-left:auto;color:var(--brand);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:32px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.card h1{margin:0 0 6px;font:calc(26px*var(--ts,1)) var(--serif)}
.card p{margin:0;color:var(--muted)}
@media print{html{--ts:1!important}}
</style>
</head>
<body>
<header><div class="in"><img src="../favicon.png" alt=""><b>KKSK Group</b><a href="../">All Apps</a></div></header>
<main><div class="card"><h1>Coming soon</h1><p>This app is being set up.</p></div></main>
</body>
</html>
