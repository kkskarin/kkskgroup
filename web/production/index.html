.upds .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--brand-soft);color:var(--brand);font-size:11px;line-height:17px;margin-left:4px}
.upds button[aria-selected=true] .n{background:rgba(255,255,255,.22);color:#fff}
input.tin{width:110px;min-height:34px;padding:5px 8px;text-align:right}
.lotno.sm{font-size:13.5px}
td input[type=checkbox],th input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}

:root[data-density="compact"] td{padding-top:6px;padding-bottom:6px}:root[data-density="compact"] th{padding-top:7px;padding-bottom:7px}:root[data-density="compact"] .card{padding:10px 12px}:root[data-density="compact"] .kcard{padding:7px 9px}
.setgrid{display:grid;gap:14px}
.setrow{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:10px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .lb{font-weight:600;color:var(--ink)}.setrow .lb small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);font-size:13.5px}
.swatch i{width:22px;height:22px;border-radius:6px;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.swatch[aria-pressed=true]{border-color:var(--hl);box-shadow:0 0 0 2px var(--brand-soft)}
@media (max-width:760px){.setrow{grid-template-columns:1fr}.tright .nm{display:none}.titles .t1{font-size:19px}.titles .t2{letter-spacing:.2em}
.top .wrap{flex-wrap:wrap;row-gap:10px}.tright{width:100%;justify-content:space-between;gap:8px}.tright .pill{order:0}.tright .rseg{order:1}.tright .me{order:2;margin-left:auto}
.me select{max-width:130px;font-size:12.5px}.avatar{width:32px;height:32px;font-size:12.5px}
.navbar #nav button{padding:11px 12px}.tabbar button{padding:10px 12px}
.demostrip{font-size:12px}.demostrip .wrap{padding-top:5px;padding-bottom:5px;gap:4px 10px;flex-wrap:nowrap}.demostrip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.demostrip .btn{min-height:28px;padding:3px 10px;font-size:12px;flex:none}
h2{font-size:21px}main.wrap{padding-top:16px}
th,td{padding-left:10px;padding-right:10px}td{font-size:13.5px}}
@media (max-width:760px){.wrap{padding-left:14px;padding-right:14px}.titles .t1{font-size:15px}.titles .t2{font-size:11px}.mark{width:44px;height:44px}.navbar #nav button{padding:12px 11px;font-size:13px}.me select{max-width:150px}.toast{left:12px;right:12px;transform:none;max-width:none}.sheet{padding:18px 16px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.7}}}

/* Tables scroll sideways inside their card; the page itself never gets wider than the screen. */
.card.tbl.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tscroll table{min-width:max-content}
#app{max-width:100vw;overflow-x:clip}
.hbtn{white-space:nowrap}
@media (max-width:760px){
  .top .wrap{flex-wrap:wrap;row-gap:8px}
  .tright{width:100%;flex-wrap:wrap;justify-content:flex-start;gap:8px}
  .tright .pill{order:0}
  .tright .rseg{order:1}
  .tright .hbtn{order:2;min-height:30px;padding:4px 10px;font-size:12.5px}
  .tright .rseg{margin-right:auto}
  .tright .me{order:3;width:100%;margin-left:0}
  .me select{max-width:none;flex:1;font-size:13px}
  .rseg button{padding:5px 10px}
}
</style>

/* ---------- dates ---------- */
const istToday=()=>new Date(Date.now()+5.5*36e5).toISOString().slice(0,10);
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dow=s=>new Date(s+'T00:00:00Z').getUTCDay();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fd=s=>{if(!s)return'';const d=new Date(s+'T00:00:00Z');return String(d.getUTCDate()).padStart(2,'0')+'-'+MON[d.getUTCMonth()]+'-'+String(d.getUTCFullYear()).slice(2)};
const fdl=s=>DOW[dow(s)]+' '+fd(s);
function lastCons(t){let d=t;for(let i=0;i<8;i++){if(dow(d)===3||dow(d)===6)return d;d=addDays(d,-1)}return t}
function nextCons(t){let d=addDays(t,1);for(let i=0;i<8;i++){if(dow(d)===3||dow(d)===6)return d;d=addDays(d,1)}return d}
const T=istToday();

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0=x=>Math.round(+x||0).toLocaleString('en-IN');
const p1=x=>(Math.round((+x||0)*10)/10).toString();
const num=v=>{const x=parseFloat(String(v??'').replace(/,/g,''));return isFinite(x)?x:null};
const band=q=>q<=500?25:q<=10000?50:q<=50000?300:500;
const target=o=>o.qty+band(o.qty);
const minOk=o=>o.qty-band(o.qty);

function histFor(sku,type){
  const h=S.hist.filter(x=>x.sku===sku&&x.type===type).sort((a,b)=>b.date.localeCompare(a.date));
  const total=h.reduce((s,x)=>s+x.qty,0);
  if(total<=20000)return{total,rates:null};
  let acc=0;const w={};let sum=0;
  for(const x of h){const take=Math.min(x.qty,20000-acc);if(take<=0)break;for(const k of RK)if(x.r[k]!=null)w[k]=(w[k]||0)+x.r[k]*take;sum+=take;acc+=take}
  const rates={};for(const k of RK)if(w[k]!=null)rates[k]=Math.round(w[k]/sum*100)/100;
  return{total,rates};
}

function nextNo(prefix,date){const mm=date.slice(5,7),yy=date.slice(2,4),k=prefix+'|'+mm+yy;if(LIVE())return prefix+'-…/'+mm+'/'+yy;S.counters[k]=(S.counters[k]||0)+1;return prefix+'-'+String(S.counters[k]).padStart(3,'0')+'/'+mm+'/'+yy}
function makeLot({sku,region,type,kind,date,out,issue,rates,rateSrc}){
  const f=yf(type,rates);
  if(issue==null)issue=Math.round(out/f);
  if(out==null)out=Math.round(issue*f);
  const l={id:LIVE()?crypto.randomUUID():'l'+(S.seq++),no:nextNo((kind==='sample'?'S':'B')+region,date),sku,issueRegion:region,region,type,kind,date,plannedOut:Math.round(out),issue:Math.round(issue),rates,rateSrc,stage:ISSUE[type].entry,m:{},status:'active',log:[{at:date,t:'Planned and issued as '+ISSUE[type].l}]};
  if(type==='crust'){l.m.crust=l.issue;l.m.takenCrust=l.issue}
  if(type==='finished'){l.m.takenFL=l.issue;l.m.rejectFL=0}
  S.lots.push(l);return l;
}
function proj(l){
  const r=l.rates||{},m=l.m,f=k=>(+r[k]||0)/100;
  if(l.type==='finished'){const t=m.takenFL??l.issue;return{tfl:t,ffl:t}}
  let crust,tc;
  if(l.type==='crust'){crust=l.issue;tc=l.issue}else{crust=m.crust??l.issue*(1-f('cs'));tc=m.takenCrust??crust*(1-f('cq'))}
  const fld=m.fld??tc*(1-f('fs'));
  const ffl=m.takenFL!=null?m.takenFL+(m.rejectFL||0):fld*(1-f('tw'));
  const tfl=m.takenFL??ffl*(1-f('fq'));
  return{crust,tc,fld,ffl,tfl};
}

const openLots=()=>S.lots.filter(l=>(l.status==='active'||l.status==='cancel_requested')&&l.stage!=='closed');

/* ---------- coverage: earliest due → furthest-along lot ---------- */
function coverage(){
  const res={},skuShort={};
  for(const s of S.skus){
    const orders=S.orders.filter(o=>o.sku===s.code&&o.pooled).sort((a,b)=>a.due.localeCompare(b.due));
    const lots=openLots().filter(l=>l.sku===s.code).sort((a,b)=>SI(b.stage)-SI(a.stage)||a.date.localeCompare(b.date));
    const sup=lots.map(l=>({l,proj:proj(l).tfl,plan:l.plannedOut}));
    const runP=sup.map(x=>x.proj),runL=sup.map(x=>x.plan);
    for(const o of orders){
      const need=Math.max(0,target(o)-o.dispatched);
      let gotP=0,gotL=0;const from=[];
      for(let i=0;i<sup.length&&gotP<need;i++){const t=Math.min(runP[i],need-gotP);if(t>0.5){runP[i]-=t;gotP+=t;from.push({no:sup[i].l.no,qty:t})}}
      for(let i=0;i<sup.length&&gotL<need;i++){const t=Math.min(runL[i],need-gotL);if(t>0){runL[i]-=t;gotL+=t}}
      const cov=o.dispatched+gotP,covL=o.dispatched+gotL,min=minOk(o);
      let st,short=0;
      if(o.dispatched>=min)st='dispatched';
      else if(cov>=min)st='covered';
      else if(covL>=min){st='shortfall';short=min-cov}
      else if(covL>o.dispatched)st='under';
      else st='none';
      res[o.id]={cov,covL,from,st,short};
      if(st==='shortfall'){(skuShort[s.code]=skuShort[s.code]||{qty:0,orders:[],lots:[]});skuShort[s.code].qty+=short;skuShort[s.code].orders.push(o)}
    }
    if(skuShort[s.code])skuShort[s.code].lots=lots.map(l=>({l,d:proj(l).tfl-l.plannedOut})).filter(x=>x.d<-0.5).sort((a,b)=>a.d-b.d);
  }
  return{res,skuShort};
}

/* ---------- pools ---------- */
function pools(reg){
  const out=[];
  for(const s of S.skus){
    const all=S.orders.filter(o=>o.sku===s.code&&o.place===reg&&o.pooled);
    const os=all.filter(o=>o.dispatched<minOk(o));
    const base=all.reduce((t,o)=>t+target(o),0);
    const mi=S.poolMoves.filter(m=>m.sku===s.code&&m.to===reg).reduce((t,m)=>t+m.qty,0);
    const mo=S.poolMoves.filter(m=>m.sku===s.code&&m.from===reg).reduce((t,m)=>t+m.qty,0);
    const planned=liveLots().filter(l=>l.sku===s.code&&l.issueRegion===reg&&l.stage!=='closed').reduce((t,l)=>t+l.plannedOut,0)
      +S.lots.filter(l=>l.sku===s.code&&l.issueRegion===reg&&l.stage==='closed').reduce((t,l)=>t+(l.m.dispatch||0),0);
    const tgt=base+mi-mo;
    if(!os.length&&!mi&&!planned)continue;
    const waiting=S.orders.filter(o=>o.sku===s.code&&o.place===reg&&!o.pooled);
    out.push({s,orders:os,tgt,mi,mo,planned,unplanned:Math.max(0,Math.round(tgt-planned)),due:os.length?os.map(o=>o.due).sort()[0]:'9999',waiting});
  }
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}

    return{ls,rows,W,WP,err:M>W?'FLD measurement can\'t exceed the lots\' taken crust ('+n0(W)+').':''}}

  const w=tr.map(l=>l.m.fld),W=w.reduce((a,b)=>a+b,0),wp=tr.map(l=>l.m.fldPcs||0),WP=wp.reduce((a,b)=>a+b,0);

function submitForm(u){
  const f=FM(u);const fail=m=>{toast(m);return false};const ed=f.editId?S.entries.find(e=>e.id===f.editId):null;
  if(!ed&&!within7(f.date))return fail('Date must be today or within the last 7 days.');
  if(ed&&!editable(ed))return fail('This entry is older than 7 days and can no longer be corrected.');
  const record=(ls,totals,per)=>{if(ed){ed.totals=totals;ed.per=per||{};ed.editedAt=T}else S.entries.push({id:'e'+(S.seq++),kind:u,region:region(),date:f.date,at:T,sku:f.sku||ls[0].sku,lotIds:ls.map(l=>l.id),totals,per:per||{}})};
  const done=(msg,ls)=>{audit(msg,ls.map(l=>l.no).join(', '));UI.fm[u]=newForm(u);UI.scene[u]='list';UI.psel&&(UI.psel[u]={});save();toast(msg+': '+ls.map(l=>l.no).join(', '));render();return true};
  if(u==='issue'){const l=f.lot&&lotOf(f.lot);if(!f.by)return fail('Choose who issued the lot.');if(!l)return fail('Choose a lot.');
    const rows=f.rows.filter(x=>num(x.m0)>0);if(!rows.length)return fail('Enter at least one M0 measurement.');if(rows.some(x=>!(num(x.pcs)>0)))return fail('Enter pieces for every row.');
    const m0=rows.reduce((t,x)=>t+num(x.m0),0),m10=Math.round(m0*1.1),pc=rows.reduce((t,x)=>t+num(x.pcs),0);
    if(!ed){l.plannedIssue=l.issue;setIssued(l,f.date);l.stage=l.type==='redye'?'dyeing':'wf1';l.issuedBy=f.by;l.crustQC=f.qc}
    l.log.push({at:T,t:(ed?'Issue corrected: ':'Issued by '+f.by+': ')+'M0 '+n0(m0)+', M10 '+n0(m10)+', '+n0(pc)+' pieces'+(!ed&&f.qc==='Yes'?', crust QC required':'')});
    l.m0=m0;l.issue=m10;l.m.issuePcs=pc;l.issueRows=rows;record([l],{m0,m10,pcs:pc,rows:rows.map(x=>({...x}))});return done(ed?'Issue corrected':'Issued',[l])}
  if(u==='wf1'||u==='wf2'){const G=f.g,keys=u==='wf1'?[['sam','sammedDate','Sammed'],['spl','splitDate','Split'],['shv','shavedDate','Shaved']]:[['dsam','dyeSammedDate','Dye sammed'],['dset','dyeSetDate','Dye set'],['vac','vacDate','Vacuumed']];
    const all=[];for(const [g,fld2,lb] of keys){for(const {l,qty} of lotRows(G[g])){l[fld2]=f.date;(l.ops=l.ops||{})[g]=qty;l.log.push({at:f.date,t:lb+(qty?' ('+n0(qty)+')':'')});if(g==='shv')l.stage='dyeing';if(g==='vac')l.stage='hooking';all.push(l)}}
    let oth=0;if(u==='wf1'){const ok=f.other.filter(o=>o.op&&num(o.qty)>0);if(f.other.some(o=>(o.op||o.qty)&&!(o.op&&num(o.qty)>0)))return fail('Each other WF1 row needs the work and a quantity.');ok.forEach(o=>{S.wf1Other.push({date:f.date,op:o.op,qty:num(o.qty),remark:o.remark||'',region:region()});oth++});if(oth)audit('Other WF1 work',oth+' row(s) without lot')}
    if(!all.length&&!oth)return fail('Add at least one lot or one other WF1 row.');
    if(!all.length){UI.fm[u]=newForm(u);UI.scene[u]='list';save();toast('Other WF1 work saved');render();return true}
    return done(u==='wf1'?'WF1 update saved':'WF2 update saved',[...new Set(all)])}
  if(u==='dye'){const rs=lotRows(f.rows);if(!rs.length)return fail('Add at least one lot.');rs.forEach(({l,qty})=>{l.dyedDate=f.date;l.stage='wf2';l.log.push({at:f.date,t:'Dyed'+(qty?' ('+n0(qty)+')':'')})});return done('Dye update saved',rs.map(x=>x.l))}
  if(u==='crust'){const l=f.lot&&lotOf(f.lot);if(!l)return fail('Choose a lot.');const v=num(f.meas),pc=num(f.pcs);
    if(!(v>0)||!(pc>0))return fail('Enter crust measurement and pieces.');if(v>l.issue)return fail('Crust can\'t exceed the issued measurement ('+n0(l.issue)+').');
    l.m.crust=v;l.m.crustPcs=pc;if(!l.qcDate){l.m.takenCrust=v;l.m.takenCrustPcs=pc}
    if(!ed){l.crustDate=f.date;l.stage='crust'}
    l.log.push({at:T,t:(ed?'Crust corrected: ':'Crust ready: ')+n0(v)+' sq ft, '+n0(pc)+' pieces'+(ed?'':', DDP '+(f.date<=l.crustDL?100:0))});record([l],{meas:v,pcs:pc});return done(ed?'Crust corrected':'Crust update saved',[l])}
  if(u==='finishing'){const rs=lotRows(f.rows);if(!rs.length)return fail('Add at least one lot.');rs.forEach(({l})=>{if(f.mode==='in'){l.finInDate=f.date;l.stage='finishing';l.log.push({at:f.date,t:'Finishing in'})}else{l.finOutDate=f.date;l.stage='fl_ready';l.log.push({at:f.date,t:'Finishing out'})}});return done(f.mode==='in'?'Finishing in saved':'Finishing out saved',rs.map(x=>x.l))}
  if(SKUFIRST.includes(u)){if(!f.sku)return fail('Choose the SKU first.');const c=splitCalc(u,f);if(c.err)return fail(c.err);
    if(u==='qc'){if(!(num(f.taken)>0))return fail('Enter the taken crust measurement.');const per={};
      c.rows.forEach(r=>{const l=r.l,old=ed&&ed.per[l.id];if(old&&old.rej)addStock(l.sku,l.region,'reject_crust',-old.rej);l.m.takenCrust=Math.round(r.taken);l.m.takenCrustPcs=Math.round(r.takenP);l.m.rejectCrust=Math.round(r.reject);l.m.rejectCrustPcs=Math.round(r.rejectP);if(!ed)l.qcDate=f.date;
        if(r.reject>0.5)addStock(l.sku,l.region,'reject_crust',r.reject);per[l.id]={rej:r.reject};l.log.push({at:T,t:(ed?'Crust QC corrected: ':'Crust QC: ')+'taken '+n0(r.taken)+', reject '+n0(r.reject)})});
      record(c.ls,{taken:num(f.taken)||0,takenP:num(f.takenP)||0,rej:num(f.rej)||0,rejP:num(f.rejP)||0},per);return done(ed?'Crust QC corrected':'Crust QC saved',c.ls)}
    if(u==='fld'){if(!(num(f.meas)>0)||!(num(f.pcs)>0))return fail('Enter FLD measurement and FL ready pieces.');
      c.rows.forEach(r=>{const l=r.l;l.m.fld=Math.round(r.fld);l.m.fldPcs=Math.round(r.pcs);if(!ed){l.fldDate=f.date;l.stage='packing'}l.log.push({at:T,t:(ed?'FLD corrected: ':'FLD measured ')+n0(r.fld)+' sq ft, '+n0(r.pcs)+' pieces'+(c.rows.length>1&&!ed?' (measured with '+(c.rows.length-1)+' other lot'+(c.rows.length>2?'s':'')+')':'')})});
      record(c.ls,{meas:num(f.meas),pcs:num(f.pcs)});return done(ed?'FLD corrected':'FLD update saved',c.ls)}
    const per={};
    c.rows.forEach(r=>{const l=r.l,old=ed&&ed.per[l.id];if(old){if(old.rej)addStock(l.sku,l.region,'reject_fl',-old.rej);if(old.exc)addStock(l.sku,l.region,'excess_fl',-old.exc)}
      l.m.takenFL=Math.round(r.taken);l.m.rejectFL=Math.round(r.reject);l.m.takenPcs=Math.round(r.takenP);l.m.rejectPcs=Math.round(r.rejectP);l.m.dispatch=Math.round(r.dispatch);l.m.dispatchPcs=Math.round(r.dispatchP);if(!ed){l.closeDate=f.date;l.stage='closed';l.status='closed'}
      l.log.push({at:T,t:(ed?'Closing corrected: ':'Closed: ')+'taken '+n0(r.taken)+', reject '+n0(r.reject)+', dispatched '+n0(r.dispatch)+(r.excess>0.5?', excess '+n0(r.excess):'')});if(r.reject>0.5)addStock(l.sku,l.region,'reject_fl',r.reject);if(r.excess>0.5)addStock(l.sku,l.region,'excess_fl',r.excess);per[l.id]={rej:r.reject,exc:r.excess};pushHist(l)});
    const D=c.rows.reduce((t,r)=>t+r.dispatch,0);if(ed){const delta=D-(ed.totals.disp||0);if(delta>0)allocate(f.sku,delta);else if(delta<0)unallocate(f.sku,-delta)}else allocate(f.sku,D);
    record(c.ls,{taken:num(f.taken)||0,takenP:num(f.takenP)||0,rej:num(f.rej)||0,rejP:num(f.rejP)||0,disp:num(f.disp)||0,dispP:num(f.dispP)||0},per);return done(ed?'Closing corrected':'Lots closed',c.ls)}
}

  return h+({plan:shPlan,lot:shLot,measure:shMeasure,crust:shCrust,move:shMove,reason:shReason,editRates:shEditRates}[s.type])(s);
}

/* rate panel shared by planning and reissue */
function rateInit(s){
  const d=defRates(s.sku,s.itype),hi=histFor(s.sku,s.itype);
  s.noDefault=!d;s.src=hi.rates?'hist':d?'default':'custom';s.fill='';s.saveDef=false;rateApply(s);
}
function rateOpts(s){
  const d=defRates(s.sku,s.itype),hi=histFor(s.sku,s.itype),o=[];
  if(hi.rates)o.push(['hist','History: latest 20,000 of '+n0(hi.total)+' sq ft']);
  if(d)o.push(['default','Default values'+(missingKeys(s.itype,d).length?' (incomplete)':'')]);
  for(const x of siblings(s.sku))if(defRates(x.code,s.itype))o.push(['copy:'+x.code,'Copy from '+x.code+' ('+x.colour+')']);
  o.push(['custom','New values for this lot only']);
  return o;
}
function rateApply(s){
  if(s.src==='custom'&&s.r)return;
  let b={};
  if(s.src==='hist')b={...histFor(s.sku,s.itype).rates};
  else if(s.src==='default')b={...(defRates(s.sku,s.itype)||{})};
  else if(s.src.startsWith('copy:'))b={...(defRates(s.src.slice(5),s.itype)||{})};
  if(s.fill){const f=defRates(s.fill,s.itype)||{};for(const k of ISSUE[s.itype].st)if(b[k]==null&&f[k]!=null)b[k]=f[k]}
  s.r={};for(const k of ISSUE[s.itype].st)s.r[k]=b[k]!=null?String(b[k]):'';
}
function rateHTML(s){
  const st=ISSUE[s.itype].st;if(!st.length)return '<div class="note">Finished leather goes straight to lot closing, so no yield rates apply.</div>';
  const miss=missingKeys(s.itype,s.r);
  let h='<div class="field"><label for="src">Yield rates</label><select id="src" data-act="src">'+rateOpts(s).map(([v,l])=>'<option value="'+v+'"'+(v===s.src?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></div>';
  const fills=siblings(s.sku).filter(x=>{const d=defRates(x.code,s.itype);return d&&miss.some(k=>d[k]!=null)});
  if(miss.length&&fills.length)h+='<div class="field"><label for="fill">Fill missing stages from the same article and substance</label><select id="fill" data-act="fill"><option value="">Choose a SKU</option>'+fills.map(x=>'<option value="'+x.code+'"'+(s.fill===x.code?' selected':'')+'>'+x.code+' ('+esc(x.colour)+')</option>').join('')+'</select></div>';
  h+='<div class="rates">'+st.map(k=>'<label for="r_'+k+'">'+RL[k]+' %</label><input type="number" inputmode="decimal" step="0.1" min="0" max="99" id="r_'+k+'" data-rk="'+k+'" value="'+esc(s.r[k])+'"'+(s.r[k]===''?' class="miss"':'')+'>').join('')+'</div>';
  if(s.noDefault)h+='<p class="hint">This SKU has no default for '+ISSUE[s.itype].l.toLowerCase()+' yet. The values you enter become its default.</p>';
  else if(s.src==='custom')h+='<label class="check sub"><input type="checkbox" data-act="saveDef"'+(s.saveDef?' checked':'')+'> Also save these as the SKU\'s default</label>';
  h+='<p class="hint">Zero is fine for a stage that usually doesn\'t happen, such as crust QC. If it happens anyway, the real loss still counts.</p>';
  return h;
}
function rateReady(s){return !ISSUE[s.itype].st.length||(!missingKeys(s.itype,s.r).length&&ISSUE[s.itype].st.every(k=>num(s.r[k])>=0&&num(s.r[k])<100))}
function rateObj(s){const o={};for(const k of ISSUE[s.itype].st)o[k]=num(s.r[k]);return o}
function rateSrcLabel(s){const o=rateOpts(s).find(x=>x[0]===s.src);return o?o[1]:'Custom'}

/* plan sheet */
function startPlan(sku,stockId){
  const st=stockId?S.stock.find(x=>x.id===stockId):null;
  const s=skuOf(sku),reg=region();
  const sh={type:'plan',title:st?'Reissue '+STOCK[st.kind].toLowerCase():'Plan Lots',subtitle:esc(sku)+', '+esc(skuName(s))+', '+REG[st?st.region:reg],sku,reg:st?st.region:reg,stockId,kind:'bulk',date:T};
  if(st){sh.itype=st.kind==='excess_fl'?'finished':st.kind==='excess_crust'?'crust':'crust';sh.n=1;sh.issueFixed=st.qty}
  else{sh.itype=wetTypes(s)[0];sh.unplanned=poolUnplanned(sku,reg)}
  rateInit(sh);planDefaults(sh);openSheet(sh);
}
function planDefaults(sh){
  if(sh.stockId)return;
  const s=skuOf(sh.sku);const f=rateReady(sh)?yf(sh.itype,rateObj(sh)):0.75;
  const issueTot=sh.unplanned/f;sh.n=Math.max(1,Math.ceil(issueTot/s.drum));sh.out=Math.round(sh.unplanned/sh.n);
}
function shPlan(sh){
  const s=skuOf(sh.sku),st=sh.stockId?S.stock.find(x=>x.id===sh.stockId):null;
  let h='';
  if(st)h+='<div class="note">'+n0(st.qty)+' sq ft of '+STOCK[st.kind].toLowerCase()+'. The new lot has no link to the lot this came from.</div>';
  else h+='<div class="note"><b>'+n0(sh.unplanned)+' sq ft</b> still to plan in this pool. Drum capacity '+n0(s.drum)+' sq ft ±'+s.tol+'%.</div>';
  const types=st?(st.kind==='excess_fl'?['finished']:st.kind==='excess_crust'?['crust']:['crust','redye']):issueTypes(s);
  h+='<div class="field"><label for="itype">Issue as</label><select id="itype" data-act="itype">'+types.map(t=>'<option value="'+t+'"'+(t===sh.itype?' selected':'')+'>'+ISSUE[t].l+'</option>').join('')+'</select>'+(st?'':'<p class="hint">Wet-end options follow the article: '+(s.tannage==='chrome'?'chrome':'chrome-free')+' '+s.type+'.</p>')+'</div>';
  if(!st)h+='<div class="row"><div class="field"><label for="kind">Lot type</label><select id="kind" data-act="kind"><option value="bulk"'+(sh.kind==='bulk'?' selected':'')+'>Bulk (B)</option><option value="sample"'+(sh.kind==='sample'?' selected':'')+'>Sample (S)</option></select></div>';
  else h+='<div class="row">';
  h+='<div class="field"><label for="pdate">Planning day</label><select id="pdate" data-act="pdate">'+[0,-1,-2].map(d=>{const v=addDays(T,d);return '<option value="'+v+'"'+(v===sh.date?' selected':'')+'>'+(d===0?'Today, ':'')+fdl(v)+'</option>'}).join('')+'</select></div></div>';
  if(!st)h+='<p class="hint" style="margin-top:-6px">Today, or up to two days back. Future days can\'t be planned.</p>';
  h+=rateHTML(sh);
  if(!st)h+='<div class="row"><div class="field"><label for="n">Number of lots</label><input type="number" id="n" data-k="n" min="1" max="20" value="'+sh.n+'"></div><div class="field"><label for="out">Planned output per lot, sq ft</label><input type="number" id="out" data-k="out" min="1" value="'+sh.out+'"></div></div>';
  h+='<div id="calc">'+planCalc(sh)+'</div>';
  h+='<div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="doPlan" id="doPlan"'+(planOK(sh)?'':' disabled')+'>'+(st?'Reissue as new lot':'Plan '+sh.n+' lot'+(sh.n>1?'s':''))+'</button></div>';
  return h;
}
function planOK(sh){if(!rateReady(sh))return false;if(sh.stockId)return true;return sh.n>=1&&sh.out>0}
function planCalc(sh){
  const s=skuOf(sh.sku);
  if(!rateReady(sh))return '<div class="note bad">Enter every stage rate before planning.</div>';
  const f=yf(sh.itype,rateObj(sh));
  const prefix=(sh.kind==='sample'?'S':'B')+sh.reg;
  const mm=sh.date.slice(5,7),yy=sh.date.slice(2,4),c=S.counters[prefix+'|'+mm+yy]||0;
  if(sh.stockId){const iss=sh.issueFixed,out=iss*f;return '<div class="note">Issue '+n0(iss)+' sq ft as '+ISSUE[sh.itype].l.toLowerCase()+', expected output '+n0(out)+' sq ft of finished leather (overall yield '+p1(f*100)+'%). Lot number '+prefix+'-'+String(c+1).padStart(3,'0')+'/'+mm+'/'+yy+'.</div>'}
  const iss=sh.out/f,lo=s.drum*(1-s.tol/100),hi=s.drum*(1+s.tol/100);
  let h='<div class="note">Each lot issues <b>'+n0(iss)+' sq ft</b> of '+ISSUE[sh.itype].l.toLowerCase()+' to give '+n0(sh.out)+' sq ft (overall yield '+p1(f*100)+'%). Lot numbers '+prefix+'-'+String(c+1).padStart(3,'0')+(sh.n>1?' to '+String(c+sh.n).padStart(3,'0'):'')+'/'+mm+'/'+yy+'.</div>';
  if(sh.itype!=='finished'&&(iss>hi||iss<lo))h+='<div class="note warn">'+n0(iss)+' sq ft is outside the drum range of '+n0(lo)+'–'+n0(hi)+'. Adjust the number of lots.</div>';
  const tot=sh.n*sh.out;if(tot>sh.unplanned+1)h+='<div class="note warn">This plans '+n0(tot)+' sq ft, '+n0(tot-sh.unplanned)+' more than the pool needs.</div>';
  return h;
}
function doPlan(){
  const sh=UI.sheet;if(!planOK(sh))return;
  const rates=rateObj(sh),key=sh.sku+'|'+sh.itype;
  if(ISSUE[sh.itype].st.length&&(sh.noDefault||sh.saveDef)){S.rates[key]={...(S.rates[key]||{}),...rates};audit('Saved default rates',sh.sku+', '+ISSUE[sh.itype].l)}
  const src=sh.noDefault?'New default values':rateSrcLabel(sh);
  const made=[];
  if(sh.stockId){const st=S.stock.find(x=>x.id===sh.stockId);const l=makeLot({sku:sh.sku,region:sh.reg,type:sh.itype,kind:'bulk',date:sh.date,issue:st.qty,rates,rateSrc:src});l.fromStock=st.kind;l.log[0].t+=' from '+STOCK[st.kind].toLowerCase()+' stock';st.qty=0;made.push(l.no)}
  else for(let i=0;i<sh.n;i++)made.push(makeLot({sku:sh.sku,region:sh.reg,type:sh.itype,kind:sh.kind,date:sh.date,out:sh.out,rates,rateSrc:src}).no);
  audit(sh.stockId?'Reissued stock':'Planned lots',made.join(', '));
  UI.sheet=null;save();toast((made.length>1?'Planned ':'Created ')+made.join(', '));render();
}

/* lot sheet */
function shLot(sh){
  const l=lotOf(sh.id),r=R(),p=proj(l),i=SI(l.stage),m=l.m;
  let h=strip(l)+'<div class="stage">'+esc(STAGES[i].l)+(MAINSUB[l.stage]?' ('+MAINSUB[l.stage](l)+')':'')+'. Issued '+n0(l.issue)+' sq ft as '+ISSUE[l.type].l.toLowerCase()+' on '+fd(l.date)+'. Rates: '+esc(l.rateSrc)+'.</div>';
  h+='<div class="figs"><div class="fig"><small>Planned output</small><b>'+n0(l.plannedOut)+'</b></div><div class="fig"><small>Projected output</small><b class="'+(p.tfl<l.plannedOut-0.5?'bad':'ok')+'">'+n0(p.tfl)+'</b></div><div class="fig"><small>Gap</small><b class="'+(p.tfl<l.plannedOut-0.5?'bad':'')+'">'+n0(p.tfl-l.plannedOut)+'</b></div></div>';
  if(l.issueDate)h+='<p class="hint">Issued '+fd(l.issueDate)+(l.m0?' (M0 '+n0(l.m0)+', M10 '+n0(l.issue)+')':'')+'. '+(l.crustDL?'Crust-ready deadline '+fd(l.crustDL)+(l.crustDate?', crust ready '+fd(l.crustDate)+', DDP '+(l.crustDate<=l.crustDL?100:0):crustLate(l)?', overdue':'')+'.':'')+'</p>';
  const {m:lo}=lotOrders();const ords=lo[l.no]||[];
  if(ords.length)h+='<p class="hint">Currently covering '+ords.map(o=>esc(o.pi)+' (due '+fd(o.due)+')').join(', ')+'.</p>';
  const rows=[];const rr=l.rates||{};
  rows.push(['Issued (M10)','',l.issueDate?l.issue:null,l.issue,m.issuePcs]);
  if(!['crust','finished'].includes(l.type)){rows.push(['Crust','cs',m.crust,p.crust,m.crustPcs]);rows.push(['Taken crust','cq',m.takenCrust,p.tc,m.takenCrustPcs])}
  if(l.type!=='finished'){rows.push(['FLD','fs',m.fld,p.fld,m.fldPcs]);rows.push(['Final FL (taken + reject)','tw',m.takenFL!=null&&l.stage==='closed'?m.takenFL+(m.rejectFL||0):null,p.ffl])}
  rows.push(['Taken FL','fq',l.stage==='closed'||l.type==='finished'?m.takenFL:null,p.tfl,m.takenPcs]);
  h+='<div class="tscroll"><table style="margin-top:12px"><thead><tr><th>Measurement</th><th class="num">Rate %</th><th class="num">Actual</th><th class="num">Expected</th><th class="num">Pieces</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x[0]+'</td><td class="num">'+(x[1]&&rr[x[1]]!=null&&ISSUE[l.type].st.includes(x[1])?p1(rr[x[1]]):'')+'</td><td class="num">'+(x[2]!=null?n0(x[2]):'')+'</td><td class="num">'+(x[2]==null?n0(x[3]):'')+'</td><td class="num">'+(x[4]!=null&&x[2]!=null?n0(x[4]):'')+'</td></tr>').join('')+(m.dispatch!=null?'<tr><td>Dispatched</td><td></td><td class="num">'+n0(m.dispatch)+'</td><td></td><td class="num">'+n0(m.dispatchPcs)+'</td></tr>':'')+'</tbody></table></div>';
  if(l.status==='active'&&l.stage!=='closed'){
    h+='<div class="row" style="margin-top:12px">';
    if(r.floor||r.plan)h+='<button class="btn small" data-act="gotoUpd" data-v="'+updFor(l)+'" data-id="'+l.id+'">Open '+UPD.find(x=>x[0]===updFor(l))[1]+'</button>';
    if(r.plan||r.admin)h+='<button class="btn small ghost" data-act="moveLot">Move to '+REG[l.region==='E'?'A':'E']+'</button>';
    if(r.plan||r.admin)h+='<button class="btn small danger" data-act="cancelLot">'+(freeCancel(l)?'Cancel Lot':'Ask to Cancel')+'</button>';
    h+='</div>';
    if(!freeCancel(l)&&(r.plan||r.admin))h+='<p class="hint">This lot has been dyed, so cancelling needs an approver.</p>';
  }
  if(l.status==='cancel_requested')h+='<div class="note warn">Cancellation is waiting for an approver.</div>';
  h+='<h3 style="margin:16px 0 6px">History</h3><ul class="log">'+l.log.map(x=>'<li>'+fd(x.at)+': '+esc(x.t)+'</li>').join('')+'</ul>';
  return h;
}

/* crust update (one lot) */
function shCrust(sh){const l=lotOf(sh.id),p=proj(l);return '<div class="row"><div class="field"><label for="cm">Crust measurement, sq ft</label><input type="number" id="cm" data-k="cm" value="'+esc(sh.cm??'')+'" placeholder="About '+n0(p.crust)+'"></div><div class="field"><label for="cr">Reject crust at QC, sq ft</label><input type="number" id="cr" data-k="cr" value="'+esc(sh.cr??'0')+'"></div></div><p class="hint" style="margin-top:-6px">Issued '+n0(l.issue)+' sq ft. Leave reject at 0 if no crust QC was done; any reject goes to reject crust stock.</p><div id="calc">'+crustCalc(sh)+'</div><div class="row"><span class="spacer"></span><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="doCrust">Save, move to Crust Stock</button></div>'}
function crustCalc(sh){const l=lotOf(sh.id),v=num(sh.cm),rj=num(sh.cr)||0;if(v==null)return '';if(v>l.issue)return '<div class="note bad">Crust can\'t exceed the issued quantity.</div>';if(rj>v)return '<div class="note bad">Reject can\'t exceed the crust measured.</div>';return '<div class="note">Crust shortage '+p1((l.issue-v)/l.issue*100)+'% (expected '+p1(l.rates.cs)+'%). Crust QC reject '+p1(rj/v*100)+'% (expected '+p1(l.rates.cq)+'%). Taken crust '+n0(v-rj)+' sq ft.</div>'}
function doCrust(){const sh=UI.sheet,l=lotOf(sh.id),v=num(sh.cm),rj=num(sh.cr)||0;if(v==null||v<=0||v>l.issue||rj<0||rj>v)return toast('Check the crust figures');l.m.crust=v;l.m.takenCrust=v-rj;l.stage='crust';l.crustDate=T;l.log.push({at:T,t:'Crust measured '+n0(v)+(rj?', '+n0(rj)+' rejected at QC':', no crust QC reject')});if(rj)addStock(l.sku,l.region,'reject_crust',rj);audit('Crust update',l.no+', '+n0(v));UI.sheet=null;save();toast(l.no+' moved to Crust Stock');render()}

/* FLD and lot closing (one or several lots of one SKU) */
const INW={fl_ready:l=>l.m.takenCrust,packing:l=>l.type==='finished'?l.m.takenFL:l.m.fld};
function startMeasure(stage,sku,ids){
  const reg=region();
  const ls=lotsAt(reg,stage).filter(x=>x.sku===sku&&x.status==='active');
  const sel={};ls.forEach(x=>sel[x.id]=ids?ids.includes(x.id):true);
  const sh={type:'measure',title:stage==='fl_ready'?'FLD Measurement':'Lot Closing Update',subtitle:esc(sku)+', '+REG[reg],stage,sku,sel,v:{}};
  openSheet(sh);
}
function closingNeed(sku){return S.orders.filter(o=>o.sku===sku&&o.pooled).reduce((t,o)=>t+Math.max(0,target(o)-o.dispatched),0)}
function selLots(sh){return Object.entries(sh.sel).filter(e=>e[1]).map(e=>lotOf(e[0]))}
function shMeasure(sh){
  const ls=Object.keys(sh.sel).map(lotOf);
  let h='<div class="lbl">Lots measured together</div>'+ls.map(l=>'<label class="check"><input type="checkbox" data-sel="'+l.id+'"'+(sh.sel[l.id]?' checked':'')+'> '+esc(l.no)+' <span class="sub">'+(sh.stage==='fl_ready'?'taken crust ':l.type==='finished'?'issued as FL ':'FLD ')+n0(INW[sh.stage](l))+' sq ft</span></label>').join('');
  const f=(k,l,hint)=>'<div class="field"><label for="m_'+k+'">'+l+'</label><input type="number" id="m_'+k+'" data-mv="'+k+'" value="'+esc(sh.v[k]??'')+'">'+(hint?'<p class="hint">'+hint+'</p>':'')+'</div>';
  if(sh.stage==='fl_ready')h+=f('fld','FLD measurement, sq ft (total)');
  if(sh.stage==='packing'){
    if(selLots(sh).some(l=>l.type!=='finished'))h+='<div class="row">'+f('taken','Taken FL, sq ft (total)')+f('reject','Reject FL, sq ft (total)')+'</div><p class="hint" style="margin-top:-6px">Final FL is taken plus reject; trimming wastage is FLD minus final FL. Lots issued as finished leather count their issue as taken.</p>';
    h+=f('dispatch','Dispatch quantity, sq ft (total)','Sent against orders automatically, earliest due date first. Open order needs for this SKU: '+n0(closingNeed(sh.sku))+' sq ft.');
  }
  h+='<div id="calc">'+measureCalc(sh)+'</div><div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="doMeasure">Save</button></div>';
  return h;
}
function measureSplit(sh){
  const ls=selLots(sh);if(!ls.length)return{err:'Pick at least one lot.'};
  const v=k=>num(sh.v[k]);
  if(sh.stage==='fl_ready'){const w=ls.map(INW.fl_ready),W=w.reduce((a,b)=>a+b,0),f=v('fld');if(f==null||f<=0)return{err:''};if(f>W)return{err:'FLD can\'t exceed taken crust ('+n0(W)+').'};return{rows:ls.map((l,i)=>({l,fld:f*w[i]/W}))}}
  const tr=ls.filter(l=>l.type!=='finished'),fl=ls.filter(l=>l.type==='finished');
  const wf=tr.map(l=>l.m.fld),WF=wf.reduce((a,b)=>a+b,0);
  let t=0,rj=0;
  if(tr.length){t=v('taken');rj=v('reject');if(t==null||rj==null||t<0||rj<0)return{err:''};if(t+rj>WF+0.5)return{err:'Taken plus reject can\'t exceed FLD ('+n0(WF)+').'}}
  const rows=[...tr.map((l,i)=>({l,taken:t*wf[i]/WF,reject:rj*wf[i]/WF})),...fl.map(l=>({l,taken:l.m.takenFL,reject:0}))];
  const TK=rows.reduce((a,r)=>a+r.taken,0),d=v('dispatch');
  if(d==null||d<0)return{err:''};if(d>TK+0.5)return{err:'Dispatch can\'t exceed taken FL ('+n0(TK)+').'};
  const need=closingNeed(sh.sku);if(d>need+0.5)return{err:'Only '+n0(need)+' sq ft is still needed by open orders; keep the rest as excess stock.'};
  rows.forEach(r=>{r.dispatch=TK?d*r.taken/TK:0;r.excess=r.taken-r.dispatch});
  return{rows};
}
function measureCalc(sh){
  const s=measureSplit(sh);if(s.err)return '<div class="note bad">'+esc(s.err)+'</div>';if(!s.rows)return '';
  const cols=sh.stage==='fl_ready'?[['fld','FLD']]:[['taken','Taken FL'],['reject','Reject FL'],['dispatch','Dispatch'],['excess','To excess']];
  return '<div class="tscroll"><table><thead><tr><th>Lot</th>'+cols.map(c=>'<th class="num">'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+s.rows.map(r=>'<tr><td>'+esc(r.l.no)+'</td>'+cols.map(c=>'<td class="num">'+n0(r[c[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="hint">Split by each lot\'s input to this stage.</p>';
}
function doMeasure(){
  const sh=UI.sheet,s=measureSplit(sh);
  if(!s.rows){toast(s.err||'Fill in the figures first');return}
  const nos=s.rows.map(r=>r.l.no).join(', ');
  for(const r of s.rows){const l=r.l;
    if(sh.stage==='fl_ready'){l.m.fld=Math.round(r.fld);l.stage='packing';l.log.push({at:T,t:'FLD measured '+n0(r.fld)+(s.rows.length>1?' (combined)':'')})}
    else{l.m.takenFL=Math.round(r.taken);l.m.rejectFL=Math.round(r.reject);l.m.dispatch=Math.round(r.dispatch);l.stage='closed';l.status='closed';
      l.log.push({at:T,t:'Closed: taken '+n0(r.taken)+', reject '+n0(r.reject)+', dispatched '+n0(r.dispatch)+(r.excess>0.5?', '+n0(r.excess)+' to excess stock':'')});
      if(r.reject>0.5)addStock(l.sku,l.region,'reject_fl',r.reject);if(r.excess>0.5)addStock(l.sku,l.region,'excess_fl',r.excess);pushHist(l)}
  }
  if(sh.stage==='packing')allocate(sh.sku,s.rows.reduce((t,r)=>t+r.dispatch,0));
  audit(sh.title+' recorded',nos);
  UI.sheet=null;save();toast('Saved for '+nos);render();
}
function addStock(sku,reg,kind,q){const e=S.stock.find(x=>x.sku===sku&&x.region===reg&&x.kind===kind&&x.qty>0);if(e){e.qty=Math.max(0,e.qty+q);if(q>0)e.date=T}else if(q>0)S.stock.push({id:'s'+(S.seq++),sku,region:reg,kind,qty:q,date:T})}
function unallocate(sku,q){for(const o of S.orders.filter(o=>o.sku===sku&&o.pooled&&o.dispatched>0).sort((a,b)=>b.due.localeCompare(a.due))){if(q<=0.5)break;const t=Math.min(o.dispatched,q);o.dispatched-=t;q-=t}}
function allocate(sku,q){for(const o of S.orders.filter(o=>o.sku===sku&&o.pooled).sort((a,b)=>a.due.localeCompare(b.due))){if(q<=0.5)break;const need=Math.max(0,target(o)-o.dispatched),t=Math.min(need,q);o.dispatched+=t;q-=t}}
function pushHist(l){
  if(l.type==='finished')return;const m=l.m,r={};
  const ffl=m.takenFL+(m.rejectFL||0);
  if(l.type!=='crust'){r.cs=(l.issue-m.crust)/l.issue*100;r.cq=(m.crust-m.takenCrust)/m.crust*100}
  r.fs=(m.takenCrust-m.fld)/m.takenCrust*100;r.tw=(m.fld-ffl)/m.fld*100;r.fq=(m.rejectFL||0)/ffl*100;
  for(const k in r)r[k]=Math.round(r[k]*100)/100;
  S.hist=S.hist.filter(h=>h.lot!==l.id);S.hist.push({lot:l.id,sku:l.sku,type:l.type,date:T,qty:l.plannedOut,r});
}

function shReason(sh){return '<p>'+esc(sh.text)+'</p><div class="field"><label for="why">Reason</label><input type="text" id="why" data-k="reason" value="'+esc(sh.reason||'')+'"></div><div class="row"><span class="spacer"></span><button class="btn ghost" data-act="close">Back</button><button class="btn" data-act="doReason">Send for Approval</button></div>'}

/* ---------- actions ---------- */
function toast(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600)}
function moveLots(ls,to,msg){for(const l of ls){l.stage=to;l.log.push({at:T,t:msg})}audit(msg,ls.map(l=>l.no).join(', '));UI.pick={};save();toast(msg+': '+ls.map(l=>l.no).join(', '));render()}
function pickedAt(stage){return picked(lotsAt(region(),stage))}
function openLot(id){const l=lotOf(id);UI.sheet={type:'lot',id,title:'Lot '+l.no,subtitle:esc(l.sku)+', '+esc(skuName(skuOf(l.sku)))+', '+REG[l.region]};render()}
function runCons(){S.orders.forEach(o=>o.pooled=true);S.cons.last=T;audit('Orders pooled','all open orders pooled by SKU');save();toast('Orders pooled by SKU');render()}
function newOrder(){
  const reg=region(),opts=S.skus.filter(s=>S.orders.some(o=>o.sku===s.code&&o.place===reg));const s=opts[Math.floor(Math.random()*opts.length)]||S.skus[0];
  const qty=[350,800,1200,2600,4800][Math.floor(Math.random()*5)];
  const room=poolUnplanned(s.code,reg)>0;
  const o={id:'o'+(S.seq++),pi:'PI-'+(2630+Math.floor(Math.random()*60))+'/1',cust:['Stride Footwear','Arcadia Shoes','Kessler Schuh','Nordlicht Leder'][Math.floor(Math.random()*4)],brand:'',sku:s.code,qty,due:addDays(T,10+Math.floor(Math.random()*30)),place:reg,pooled:room,dispatched:0,arrived:T};
  S.orders.push(o);audit('New order from Zoho',o.pi+', '+s.code+', '+n0(qty));save();
  toast(room?o.pi+' joined the '+s.code+' pool today':o.pi+' waits for the next pooling; the '+s.code+' pool is fully planned');render();
}
function decide(id,ok){
  const a=S.approvals.find(x=>x.id===id);if(!a)return;a.status=ok?'approved':'refused';a.decidedBy=R().label;
  if(a.kind==='cancel'){const l=lotOf(a.lotId);if(ok){l.status='cancelled';l.log.push({at:T,t:'Cancelled with approval. Number '+l.no+' is retired.'})}else{l.status='active';l.log.push({at:T,t:'Cancellation refused'})}}
  if(a.kind==='moveLot'&&ok){const l=lotOf(a.lotId);l.region=a.to;l.log.push({at:T,t:'Moved from '+REG[a.from]+' to '+REG[a.to]+'; number unchanged'})}
  if(a.kind==='movePool'&&ok){const room=poolUnplanned(a.sku,a.from);const q=Math.min(a.qty,room);S.poolMoves.push({sku:a.sku,from:a.from,to:a.to,qty:q})}
  audit(ok?'Approved':'Refused',apText(a).replace(/<[^>]+>/g,''));save();toast(ok?'Approved':'Refused');render();
}

    case 'addRow':{const parts=t.dataset.g.split('.');let o=UI.fm;for(const x of parts)o=o[x];o.push(parts[0]==='issue'?{grade:'',size:'',pcs:'',m0:''}:parts[1]==='other'?{op:'Sammed',qty:'',remark:''}:{lot:'',qty:''});render();break}

    case 'subIssue':submitForm('issue');break;case 'subWF1':submitForm('wf1');break;case 'subDye':submitForm('dye');break;case 'subWF2':submitForm('wf2');break;case 'subCrust':submitForm('crust');break;case 'subFin':submitForm('finishing');break;case 'subFLD':submitForm('fld');break;case 'subClose':submitForm('closing');break;
    case 'gotoUpd':UI.upd=t.dataset.v;UI.sheet=null;S.tab='entry';save();if(t.dataset.id){goForm(t.dataset.v,[t.dataset.id]);break}S.tab='entry';save();render();break;
    case 'kview':UI.kview=t.dataset.v;render();break;
    case 'clearF':UI.f={};render();break;
    case 'movePool':{const reg=region();UI.sheet={type:'move',title:'Move Quantity to '+REG[reg==='E'?'A':'E'],subtitle:esc(t.dataset.sku),sku:t.dataset.sku,from:reg,to:reg==='E'?'A':'E',max:poolUnplanned(t.dataset.sku,reg),qty:poolUnplanned(t.dataset.sku,reg)};render();break}
    case 'doMove':{const q=num(sh.qty);if(!q||q<=0||q>sh.max)return toast('Enter up to '+n0(sh.max)+' sq ft');S.approvals.push({id:'ap'+(S.seq++),kind:'movePool',sku:sh.sku,from:sh.from,to:sh.to,qty:q,by:r.label,reason:sh.reason||'',at:T,status:'pending'});audit('Asked to move quantity',sh.sku+', '+n0(q));UI.sheet=null;save();toast('Sent for approval');render();break}
    case 'moveLot':{const l=lotOf(sh.id);UI.sheet={type:'reason',title:'Move '+l.no+' to '+REG[l.region==='E'?'A':'E'],text:'The lot keeps its number. Once approved it shows on '+REG[l.region==='E'?'A':'E']+'\'s screens only.',next:{kind:'moveLot',lotId:l.id,from:l.region,to:l.region==='E'?'A':'E'}};render();break}
    case 'cancelLot':{const l=lotOf(sh.id);if(freeCancel(l)){if(confirm('Cancel '+l.no+'? This is permanent and the number is not reused.')){l.status='cancelled';l.log.push({at:T,t:'Cancelled before dyeing. Number '+l.no+' is retired.'});audit('Lot cancelled',l.no);save();toast(l.no+' cancelled');closeSheet()}}else{UI.sheet={type:'reason',title:'Ask to cancel '+l.no,text:'This lot has been dyed, so an approver must confirm. A cancelled lot is permanent and its number is never reused.',next:{kind:'cancel',lotId:l.id}};render()}break}
    case 'doReason':{const nx=sh.next;S.approvals.push({id:'ap'+(S.seq++),...nx,by:r.label,reason:sh.reason||'',at:T,status:'pending'});if(nx.kind==='cancel')lotOf(nx.lotId).status='cancel_requested';audit(nx.kind==='cancel'?'Asked to cancel':'Asked to move lot',lotOf(nx.lotId).no);UI.sheet=null;save();toast('Sent for approval');render();break}
    case 'approve':decide(t.dataset.id,true);break;
    case 'refuse':decide(t.dataset.id,false);break;

    case 'doEditRates':{for(const ty in sh.v){const o={};let any=false;for(const k in sh.v[ty]){const x=num(sh.v[ty][k]);if(x!=null){o[k]=x;any=true}}const key=sh.sku+'|'+ty;if(any)S.rates[key]=o;else delete S.rates[key]}audit('Edited default rates',sh.sku);UI.sheet=null;save();toast('Defaults saved');render();break}
  }
});
app.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act,sh=UI.sheet;
  if(a==='role'){S.role=t.value;S.viewAs=t.value!=='super';const r=ROLES[S.role];if(r.region)S.region=r.region;UI.sheet=null;save();render();return}
  if(a==='showAll'){UI.showAll=t.checked;render();return}
  if(t.dataset.fp){setPath(t.dataset.fp,t.value);const p=t.dataset.fp;if(/\.lot$/.test(p)&&t.value){const q=p.replace(/\.lot$/,'.qty');const parts=q.split('.');let o=UI.fm;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];if(o&&'qty' in o&&!o.qty)o.qty=String(curQty(lotOf(t.value)))}if(/\.sku$/.test(p)){const f=FM(p.split('.')[0]);f.sel={}}render();return}
  if(t.dataset.psel){const [u,id]=t.dataset.psel.split('.');(UI.psel=UI.psel||{});(UI.psel[u]=UI.psel[u]||{})[id]=t.checked;render();return}
  if(t.dataset.fsel){const [u,id]=t.dataset.fsel.split('.');FM(u).sel[id]=t.checked;render();return}
  if(t.dataset.f){(UI.f=UI.f||{})[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;render();return}
  if(t.dataset.pick){(UI.pick=UI.pick||{})[t.dataset.pick]=t.checked;render();return}
  if(t.dataset.pickall!==undefined){UI.pick=UI.pick||{};t.dataset.pickall.split(',').filter(Boolean).forEach(id=>UI.pick[id]=t.checked);render();return}

  if(a==='fill'){sh.fill=t.value;const keep=sh.src;rateApply(sh);sh.src=keep;planDefaults(sh);render();return}
  if(a==='kind'){sh.kind=t.value;render();return}
  if(a==='pdate'){sh.date=t.value;render();return}
  if(a==='saveDef'){sh.saveDef=t.checked;return}
  if(t.dataset.sel){sh.sel[t.dataset.sel]=t.checked;render();return}

app.addEventListener('input',e=>{

  if(t.dataset.mv){sh.v[t.dataset.mv]=t.value;calc();return}
  if(t.dataset.er){const [ty,k]=t.dataset.er.split('|');sh.v[ty][k]=t.value;return}

});

/* ---------- boot ---------- */
window.__ppStart=function(me){
  const key=me.role==='super_admin'?'super':me.role==='admin'?'admin':me.role==='approver'?'approver':me.region?me.role+'_'+me.region:me.role;
  if(!ROLES[key]){app.innerHTML='<main class="wrap"><div class="empty">Your Production Planning role is not recognised. Ask an admin.</div></main>';return}
  ROLES[key].who=me.name||ROLES[key].who;
  const begin=()=>{
    if(!(me.super&&S.role&&ROLES[S.role]&&S.viewAs))S.role=key;
    if(ROLES[S.role].region)S.region=ROLES[S.role].region;
    window.__pp={get S(){return S},render,coverage,pools,proj,histFor,seed};
    render();
  };
  const L=window.PPLive;
  if(!L||L.mode(me)==='demo'){S=load();if(!S){seed();save()}begin();return}
  /* Live: the KKSK-Production tables. */
  const fresh=()=>{const st={v:6,entries:[],wf1Other:[],role:key,region:me.region||'E',tab:'orders',skus:[],orders:[],lots:[],stock:[],approvals:[],poolMoves:[],rates:{},hist:[],counters:{},cons:{last:lastCons(T)},audit:[],seq:1};return L.restoreUI(st,me)};
  const keep=()=>({role:S.role,viewAs:S.viewAs,region:S.region,tab:S.tab,prefs:S.prefs,seq:S.seq});
  L.load(me,fresh()).then(st=>{S=st;begin();
    L.watch((what,info)=>{
      if(what==='busy')return !!UI.sheet;
      if(what==='lots'){toast((info.length>1?'Lot numbers ':'Lot number ')+info.join(', '));render();return}
      if(what==='error'){toast('Not saved: '+info+'. Showing the latest saved data.')}
      const k=keep();return L.load(me,Object.assign(fresh(),k)).then(st2=>{S=st2;render()},()=>toast('Couldn\'t refresh. Check the connection.'));
    });
  },e=>{app.innerHTML='<main class="wrap" style="padding-top:40px"><div class="empty">Live data couldn\'t be loaded ('+esc((e&&e.message)||'connection')+'). Reload the page'+(me.admin||me.super?', or switch to <button class="btn small ghost" onclick="PPLive.toggle()">Demo</button>':'')+'.</div></main>'});
};
})();

(function () {
  "use strict";
  var app = document.getElementById("app");
  function stop(msg) { app.innerHTML = '<main class="wrap" style="padding-top:40px"><div class="empty">' + msg + ' <a href="../">Back to KKSK Group</a></div></main>'; }
  app.innerHTML = '<main class="wrap" style="padding-top:40px"><div class="empty">Opening Production Planning\u2026</div></main>';
  window.bvPortal().then(function (p) {
    var pp = p.apps && p.apps.pp;

    return window.bvSupabase.auth.getSession().then(function (r) {

      return fetch(window.PP_CONFIG.url + "/functions/v1/kksk-handover", { method: "POST", headers: { Authorization: "Bearer " + tok, apikey: window.PP_CONFIG.key } });
    }).then(function (res) { return res.json().then(function (j) { if (!res.ok) throw j; return j; }); }).then(function (h) {
      /* The KKSK-Production session, for the real tables (Zoho orders and lots). */
      window.ppDb = window.supabase.createClient(window.PP_CONFIG.url, window.PP_CONFIG.key, { auth: { persistSession: false, autoRefreshToken: true } });
      return window.ppDb.auth.setSession({ access_token: h.access_token, refresh_token: h.refresh_token }).then(function () {
        var apps = (p.apps.bv ? 1 : 0) + (p.apps.pp ? 1 : 0);
        window.PP_ME = { name: p.name || h.user.name, email: p.email, role: h.user.role, region: h.user.region, super: !!p.super, admin: !!p.admin, apps: apps };
        window.__ppStart(window.PP_ME);
      });
    });
  }).catch(function (e) { stop((e && e.message) || "Production Planning couldn't be opened. Check the connection and reload."); });
})();
