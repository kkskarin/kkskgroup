# Netlify: serve KKSK Group from web/ (static files, no build step).
#   /                home and sign-in
#   /maintenance/    Maintenance       } one page (web/bills/index.html); the address picks the app.
#   /renewable/      Renewable Energy  } /bills/ is the old address of Maintenance and moves there.
#   /bills-vouchers/ Bills & Vouchers  }
#   /accounts/       Accounts          }
#   /finance/        Finance           }
#   /approvals/      Approvals         }
#   /costing/        W/B Costing (its own usernames and passwords inside; records in wb_* collections)
#   /production/     Production Planning (hidden for now: the page sends people back home)
#   /inv/            not on the All Apps page; reached only by its address
# Netlify treats /maintenance and /maintenance/ alike, so each address is served directly (a slash redirect would loop).
[build]
  publish = "web"
  command = ""

[[redirects]]
  from = "/maintenance"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/renewable"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/bills-vouchers"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/bills-vouchers/*"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/accounts"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/finance"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/maintenance/*"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/renewable/*"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/accounts/*"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/finance/*"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/approvals"
  to = "/bills/index.html"
  status = 200
[[redirects]]
  from = "/approvals/*"
  to = "/bills/index.html"
  status = 200

[[redirects]]
  from = "/inv"
  to = "/inv/index.html"
  status = 200
